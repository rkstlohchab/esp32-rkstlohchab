<rect x="40" y="1250" width="1320" height="215" rx="12" fill="#ffffff" stroke="#cfdae0"/>
<text x="60" y="1282" class="heading" text-anchor="start">POWER AND UNCONNECTED SIGNALS</text>
<text x="60" y="1310" class="small" text-anchor="start">USB powers the tested build. All module grounds connect to common GND through the breadboard rails.</text>
<text x="60" y="1338" class="small" text-anchor="start">3V3: joystick, NRF24, CC1101, TFT backlight; PN532 supply follows the documented 3V3 plan. Add 10–47 µF near NRF24.</text>
<text x="60" y="1366" class="small" text-anchor="start">TFT VCC / SD / GPS / IR supply: confirm the exact breakout rating; MCU signal levels must be 3.3 V compatible.</text>
<text x="60" y="1394" class="small" text-anchor="start">Leave GPS RX, NRF24 IRQ, and CC1101 GDO2 open. Touch IRQ46 is wired but polled. GPIO45/46 are strapping pins.</text>
<text x="60" y="1422" class="small" text-anchor="start">Battery / TP4056 / switch are mechanical provisions only; no verified regulated battery power schematic is included.</text>
<text x="60" y="1450" class="small" text-anchor="start">Sources: ESP32-DIV/BoardConfig.h · tft_espi-patch/User_Setup.h · hardware/pin-map.csv. See hardware/README.md.</text>
